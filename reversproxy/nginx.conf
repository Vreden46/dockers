events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Umleitung aller HTTP-Anfragen auf HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate      /zert/fullchain.pem;
        ssl_certificate_key  /zert/privkey.pem;

        location / {
            proxy_pass https://217.160.162.190:1443/;
            proxy_set_header  Host $host;
            proxy_set_header  X-Real-IP $remote_addr;
            proxy_set_header  X-Forwarded-Proto https;
            proxy_set_header  X-Forwarded-Host $host;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffers 16 4k;
            proxy_buffer_size 2k;
        }

        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /portainer/ {
            proxy_pass https://217.160.162.190:9443/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /portainer/api/websocket/ {
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_pass http://217.160.162.190/api/websocket/;
        }
    }

    server {
        listen 80;
        server_name cloud.pro-vreden.site;

        # Umleitung aller HTTP-Anfragen auf HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name cloud.pro-vreden.site;

        ssl_certificate      /zert/cp/fullchain.pem;
        ssl_certificate_key  /zert/cp/privkey.pem;

        location / {
            proxy_pass http://217.160.162.190:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

